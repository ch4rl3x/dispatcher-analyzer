name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin verifyPluginProjectConfiguration verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-and-reports
          path: |
            build/distributions/*.zip
            build/reports/
